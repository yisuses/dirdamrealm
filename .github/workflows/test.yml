name: Whemotion Blog Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'
      - name: Run tests
        run: |
          yarn
          yarn test:blog --coverage=false
 
 